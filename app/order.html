}
// 这一轮结束了（结账、作废、换二维码、转台 / 并台、太久没人动；或者老页面写不进去）：盖一层提示，请顾客重新扫码 / 重新打开
function scEnded(reason, to) {
  if (!SC) return;
  SC.ended = true;
  clearTimeout(SC.timer); SC.timer = null; SC.outbox = null;
  document.querySelectorAll(".sc-sheet, .dup-sheet").forEach((x) => x.remove());
  $("#scEnded")?.remove(); $("#scMoved")?.remove();
  const el = document.createElement("div");
  el.className = "sc-ended"; el.setAttribute("role", "alert");
  el.id = to ? "scMoved" : "scEnded";
  const msg = to ? `这桌已经换到 ${to} 桌，请扫 ${to} 桌上的二维码继续点餐`
    : reason === "expired" ? "购物车太久没人动，已经清空。要接着点菜，请重新打开"
    : "这一桌的点餐已经结束。要接着点菜，请重新扫桌上的二维码";
  el.innerHTML = `<div class="sc-ended-card"><p>${esc(msg)}</p><button type="button" class="btn primary big" data-reopen>重新打开</button></div>`;
  el.addEventListener("click", (e) => { if (e.target.closest("[data-reopen]")) location.reload(); });
  document.body.appendChild(el);
}
// 加入这桌（拿到「手机 N」）
function scJoin() { SC.extra.push({ op: "join" }); scFlush(); }

// 服务器上的购物车 → 本机
function applyDraft(d, { force = false } = {}) {
  const was = SC;
  const epochChanged = Boolean(was && was.epoch !== d.epoch);
  if (!SC) SC = { base: new Map(), outbox: null, noteLocal: null, headLocal: null, extra: [], others: [], subKey: null, shownSent: null, version: -1 };
  let hadMine = false;
  if (epochChanged) {
    // 换了一轮（结账、作废、转台、太久没人动……）：上一轮没下单的菜都不要了，老的操作也不再发
    hadMine = S.cart.size > 0 || was.others.length > 0;
    S.cart.clear(); SC.base = new Map(); SC.outbox = null; SC.noteLocal = null; SC.headLocal = null; SC.extra = []; S.guests = null;
  }
  // 别的手机刚下了单（或者别人去掉了我的菜）：这些行已经「死」了。本机还没发出去的「+」按差额变成新的一行，
  // 下过的那部分绝不再发（以前会把整行原样再发一次，厨房多做一份）
  const dead = new Set(d.dead || []);
  // 还在路上（发出去还没收到回复、或者要重发）的那一批里改过的行：先不算，等那一批的回复说清楚「实际改成了几份」再算
  const pending = new Set(((SC.outbox && SC.outbox.ops) || []).filter((o) => o.op === "put").map((o) => o.line));
  if (!epochChanged && dead.size) {
    for (const [k, l] of [...S.cart]) {
      if (!l.lid || !dead.has(l.lid) || pending.has(l.lid)) continue;
      const extra = l.qty - ((SC.baseQty && SC.baseQty.get(l.lid)) || 0);
      if (extra > 0) { l.lid = newLid(); l.qty = extra; } else S.cart.delete(k);
      SC.rebased = true;
    }
  }
  const dirty = !epochChanged && !force && scOps().length > 0;
  const prevVersion = SC.version;
  Object.assign(SC, { epoch: d.epoch, version: d.version, key: d.key, me: d.me, host: d.host, hostOnly: d.host_only, full: d.full,
    note: d.note, head: d.head_count, guests: d.guests || [], lastSent: d.last_sent, fetchedAt: Date.now() });
  const known = (l) => Boolean(itemById(l.menu_item_id));
  const mine = d.me == null ? [] : d.lines.filter((l) => l.g === d.me);
  SC.others = d.lines.filter((l) => l.g !== d.me && known(l));
  SC.base = new Map(mine.map((l) => [l.id, lineSig({ id: l.menu_item_id, options: l.options, note: l.note, qty: l.qty })]));
  SC.baseQty = new Map(mine.map((l) => [l.id, l.qty]));
  if (!dirty) {
    // 没有还没发出去的改动：本机购物车 = 服务器上我加的菜
    S.cart = new Map(mine.filter(known).map((l) => [cartKey(l.menu_item_id, l.options) + "#" + (l.note || ""), { id: l.menu_item_id, options: l.options, note: l.note || "", qty: l.qty, lid: l.id }]));
    if (force) { SC.noteLocal = null; SC.headLocal = null; SC.extra = []; }
  }
  if (SC.noteLocal != null && SC.noteLocal.trim() === (d.note?.text || "")) SC.noteLocal = null;
  if (d.head_count) { S.guests = d.head_count; if (SC.headLocal === d.head_count) SC.headLocal = null; }
  scSubscribe();
  if (epochChanged) {
    const why = SC.resetWhy; SC.resetWhy = null;
    if (why === "expired" && hadMine) toast(I18N.t("购物车太久没人动，已经清空"), "error");
    else if (hadMine && !SC.moved) toast(I18N.t("上一桌的点餐已经结束，购物车已经清空"), "error");
  }
  // 差额变成的新行（或者别的还没发出去的改动）：接着发
  if (SC.rebased && !SC.ended && !SC.timer && !SC.inflight) { SC.rebased = false; scSync(); }
  return SC.version !== prevVersion || epochChanged;
}

// 本机和服务器上「我加的菜」有什么不一样 → 要发的操作
function scOps() {
  if (!SC) return [];
  const ops = [], seen = new Set();
  for (const l of S.cart.values()) {
    if (!l.lid) l.lid = newLid();
    seen.add(l.lid);
    if (SC.base.get(l.lid) !== lineSig(l)) ops.push({ op: "put", line: l.lid, item: l.id, options: l.options || [], note: l.note || "", qty: l.qty });
  }
  for (const lid of SC.base.keys()) if (!seen.has(lid)) ops.push({ op: "put", line: lid, qty: 0 });
  if (SC.noteLocal != null && SC.noteLocal.trim() !== (SC.note?.text || "")) ops.push({ op: "note", text: SC.noteLocal.trim() });
  if (SC.headLocal && SC.headLocal !== SC.head) ops.push({ op: "guests", n: SC.headLocal });
  return ops.concat(SC.extra);
}
// 本机改了购物车：300 毫秒后合成一批发出去
function scSync() {
  if (!SC) return;
  clearTimeout(SC.timer);
  SC.timer = setTimeout(scFlush, 300);
}
async function scFlush() {
  if (!SC || SC.ended) return;
  clearTimeout(SC.timer); SC.timer = null;
  if (SC.inflight) { SC.again = true; return; }
  if (!SC.outbox) {
    const ops = scOps();
    if (!ops.length) return;
    SC.outbox = { op_id: "o" + newLid(), ops };
    SC.extra = [];
  }
  SC.inflight = true;
  const box = SC.outbox;
  try {
    const d = await api(cartUrl(), { method: "POST", auth: false, body: { epoch: SC.epoch, guest_id: cartGid(), op_id: box.op_id, ops: box.ops } });
    if (SC.outbox === box) SC.outbox = null;
    SC.retry = 0;
    scOffline(false);
    // 这一批实际改成了几份（网络重试时服务器原样告诉我们）：先按这个记下「服务器上有几份」，再按差额算还没发出去的
    if (d.applied) { if (!SC.baseQty) SC.baseQty = new Map(); for (const [lid, q] of Object.entries(d.applied)) SC.baseQty.set(lid, q); }
    // 服务器说作废的行（重启后不确定是不是重发）：整行去掉，不按差额再加
    for (const lid of d.dropped || []) for (const [k, l] of [...S.cart]) if (l.lid === lid) S.cart.delete(k);
    applyDraft(d);
    scRefreshUi();
  } catch (err) {
    if ((!err.status || err.status >= 500 || err.status === 429) && err.data?.code !== "CART_JOIN_LIMIT") {
      // 网络不好：同一批稍后原样重发（服务器按 op_id 去重，不会加两次）
      scOffline(true);
      SC.retry = Math.min((SC.retry || 0) + 1, 4);
      SC.timer = setTimeout(scFlush, 1000 * 2 ** SC.retry);
    } else {
      SC.outbox = null;
      const code = err.data?.code;
      if (code === "CART_STALE") { scEnded("stale"); return; }
      if (code === "CART_FULL" || code === "CART_JOIN_LIMIT") { scFull(); return; }
      if (err.data?.draft) applyDraft(err.data.draft, { force: true });
      else await loadShared().catch(() => {});
      toast(err.message, "error");
      scRefreshUi(true);
    }
  } finally {
    if (SC) { SC.inflight = false; if (SC.again || SC.rebased) { SC.again = false; SC.rebased = false; scSync(); } }
  }
}
// 下单前：把还没发出去的都发完（最多等 6 秒）
async function scSettle() {
  for (let i = 0; i < 30 && SC && (SC.inflight || SC.outbox || scOps().length); i++) {
    if (!SC.inflight) await scFlush(); else await new Promise((r) => setTimeout(r, 200));
  }
  return Boolean(SC) && !SC.inflight && !SC.outbox && !scOps().length;
}

// 拿最新的购物车（收到推送、重新连上、切回页面、每 10 秒兜底）
let scFetchTimer = null, scFetching = false;
function scFetch(soon = 80) {
  if (!SC || SC.ended) return;
  clearTimeout(scFetchTimer);
  scFetchTimer = setTimeout(async () => {
    if (scFetching) return scFetch(300);
    scFetching = true;
    try {
      const was = Boolean(SC);
      const on = await loadShared();
      if (was && !on) { renderMenu(); document.querySelector(".sc-sheet")?.remove(); return; } // 店里刚关掉共享购物车
      scRefreshUi();
    } catch {} finally { scFetching = false; }
  }, soon);
}
function scSubscribe() {
  if (!SC || !live || SC.subKey === SC.key) return;
  if (live.send({ type: "cart_sub", key: SC.key })) SC.subKey = SC.key;
}
// 服务器推来的消息
function onCartMsg(msg) {
  if (!SC || SC.ended) return;
  if (msg.reset) {
    // 店里关掉了共享购物车：退回各点各的（自己加的菜留着）；别的原因：这一轮结束了
    if (msg.reset === "off") { SC.subKey = null; return scFetch(0); }
    return scEnded(msg.reset, msg.to);
  }
  if (msg.v > SC.version) scFetch();
}
setInterval(() => {
  if (!SC || document.hidden) return;
  if (!live || !live.connected() || document.querySelector(".sc-sheet")) scFetch(0);
}, 10000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && SC) { SC.subKey = null; scFetch(0); } });

// 购物车变了以后：底部栏、菜单上的「+」（别人点走了限量的菜）、开着的购物车弹层、「已送到厨房」
let scListSig = "";
function scRefreshUi(full = false) {
  if (!SC) return;
  scShowSent();
  if (typeof S.onSharedChange === "function") S.onSharedChange();
  // 正在问「几位用餐」，别的手机已经答了：不用再问
  if (document.querySelector(".guests-page") && SC.head) { S.guests = SC.head; app.innerHTML = ""; renderMenu(); return; }
  if (document.querySelector(".closed-page, .guests-page, .kiosk-done")) return;
  if (!$("#menuItems")) return;
  // 别人加的限量菜会让「+」变灰：只有这种时候才重画菜单（不然只更新底部栏）
  const sig = JSON.stringify([[...S.cart.values()].map(lineSig), SC.others.filter((l) => (itemById(l.menu_item_id) || {}).left != null || (l.options || []).length).map((l) => [l.menu_item_id, l.options, l.qty])]);
  if (full || sig !== scListSig) { scListSig = sig; renderMenu(); } else renderCartBar();
}
function scOffline(on) {
  let el = $("#scOffline");
  if (!on) { el?.remove(); return; }
  if (el) return;
  el = document.createElement("div");
  el.id = "scOffline"; el.className = "sc-float warn"; el.setAttribute("role", "status");
  el.textContent = "网络不好，你加的菜会自动重新发送";
  document.body.appendChild(el);
}
// 「已送到厨房 ✓（手机 2 提交）」：所有手机都显示几秒
function scShowSent() {
  const ls = SC?.lastSent;
  if (!ls || ls.ago > 60000) return;
  const k = SC.epoch + ":" + ls.v;
  if (SC.shownSent === k) return;
  SC.shownSent = k;
  $("#scSent")?.remove();
  const el = document.createElement("div");
  el.id = "scSent"; el.className = "sc-float sent"; el.setAttribute("role", "status");
  el.textContent = ls.g === SC.me ? "已送到厨房 ✓（你提交的）" : `已送到厨房 ✓（${phoneLabel(ls.g)} 提交）`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 8000);
  loadOrdered().then(() => { refreshOrdered(); if ($("#menuItems") && !document.querySelector(".guests-page")) renderMenu(); }).catch(() => {});

  if (sh && !SC.others.length && !S.cart.size) sh.remove();
}
// 最近 30 秒还在改购物车的别的手机
function activeOthers() {
  if (!SC) return [];
  const age = Date.now() - SC.fetchedAt;
  return SC.guests.filter((g) => g.n !== SC.me && g.edit_ago != null && g.edit_ago + age < 30000).map((g) => phoneLabel(g.n));
}
const othersQty = (id) => (SC ? SC.others.filter((l) => l.menu_item_id === id).reduce((s, l) => s + l.qty, 0) : 0);

// ---------- 共享购物车弹层：按手机分组，全桌的菜、谁加的、总价；谁都可以下单 ----------
function openSharedCart() {

    $(".sc-msg", m).innerHTML = msg;

    if (document.activeElement !== note && SC.noteLocal == null) note.value = SC.note?.text || "";

    $(".sc-foot", m).innerHTML = `<div class="sum num" style="flex:1;font-size:18px;font-weight:700">${money(total)} <small class="muted" style="font-size:12px;font-weight:400">全桌 ${countLabel(count)}</small></div>

  };
  S.onSharedChange = () => {

  const setMsg = (html) => { msg = html; render(); $(".sb", m).scrollTop = 0; };
  const warn = (text) => `<div class="stock-msg" role="alert">${ICON.alert}<span>${text}</span></div>`;
  m.addEventListener("click", async (e) => {
    const ln = e.target.closest("[data-lnote]");
    if (ln) {
      const old = S.cart.get(ln.dataset.lnote);
      const item = itemById(old.id);
      return openNoteSheet(`「${item.name}」口味备注`, old.note, (nt) => {
        // 改备注后这一行留在原来的位置，共享购物车里还是同一行（同一个编号，只改备注）
        const nk = cartKey(item.id, old.options) + "#" + nt;
        if (nk === ln.dataset.lnote) return;
        const entries = [...S.cart];
        const at = entries.findIndex(([k]) => k === ln.dataset.lnote);
        const same = S.cart.get(nk);
        if (same) { same.qty = Math.min(99, same.qty + old.qty); entries.splice(at, 1); }
        else entries[at] = [nk, Object.assign({}, old, { note: nt })];
        S.cart = new Map(entries);
        scSync();
        render();
      });
    }
    const line = e.target.closest("[data-line]");
    if (line) { changeLine(line.dataset.line, Number(line.dataset.d)); render(); renderMenu(); return; }
    const rm = e.target.closest("[data-rmo]");
    if (rm) {
      const l = SC.others.find((x) => x.id === rm.dataset.rmo);
      const i = l && itemById(l.menu_item_id);
      if (!l || !confirm(I18N.t(`去掉 ${phoneLabel(l.g)} 加的「${i ? i.name : ""}」？`))) return;
      SC.extra.push({ op: "put", line: l.id, qty: 0, other: true });
      SC.others = SC.others.filter((x) => x !== l);
      render(); renderCartBar();
      return scFlush();
    }
    if (onPackClick(e, m)) return;
    if (e.target.closest("[data-wait]")) { setMsg(""); return; }
    const now = e.target.closest("[data-now]");
    const submit = now || e.target.closest("#submit");
    if (!submit || submit.disabled) return;
    if (now) askBusy = false;
    await doSubmit(now ? $("#submit", m) || now : submit);
  });
  async function doSubmit(btn) {
    btn.disabled = true;
    const label0 = btn.textContent;
    btn.textContent = "下单中…";
    const restore = () => { if (btn.isConnected) { btn.disabled = false; btn.textContent = label0; } };
    if (!(await scSettle())) { toast(I18N.t("网络不好，请稍后再试"), "error"); return restore(); }
    await loadShared().catch(() => {}); // 下单前再看一眼最新的（别人刚加的菜、谁还在选）
    if (!SC.others.length && !S.cart.size) { m.remove(); return; }
    const busy = activeOthers();
    if (askBusy && busy.length) {
      askBusy = false;
      return setMsg(`<div class="sc-busy" role="alert">${ICON.alert}<span><b>${esc(busy.join("、"))} 还在选菜，确定现在下单吗？</b></span>
        <div class="sc-busy-btns"><button type="button" class="btn" data-wait>等一下</button><button type="button" class="btn primary" data-now>现在下单</button></div></div>`);
    }
    try {
      const r = await api(`${cartUrl()}/submit`, { method: "POST", auth: false, body: { epoch: SC.epoch, version: SC.version, guest_id: cartGid(), pack: Boolean(S.pack) } });
      msg = "";
      applyDraft(r.draft);
      if (r.duplicate) toast(I18N.t(`已经由 ${phoneLabel(r.by)} 提交了`), "success");
      else toast(S.pack ? "下单成功，这些菜会打包好给您 🥡" : "下单成功，厨房已收到 👨‍🍳", "success");
      S.pack = false;
      m.remove();
      if (r.order) S.ordered = r.order;
      await loadOrdered().catch(() => {});
      scRefreshUi(true);
    } catch (err) {
      const code = err.data?.code;
      if (err.data?.draft) applyDraft(err.data.draft, { force: true });
      if (code === "STOCK_SHORT") {
        await loadMenu().catch(() => {});
        const cut = (err.data.cut || []).map((c) => (c.to > 0 ? `「${esc(c.name)}」（${phoneLabel(c.g)}）只剩 ${c.to} 份` : `「${esc(c.name)}」（${phoneLabel(c.g)}）已经卖完了`));
        scRefreshUi(true);
        if (!SC.others.length && !S.cart.size) { m.remove(); toast(err.message, "error"); return; }
        return setMsg(warn(`<b>有的菜不够了，购物车已经改好，请再确认一下</b>${cut.map((c) => `<div class="sc-cut">${c}</div>`).join("")}`));
      }
      if (code === "CART_CHANGED") { scRefreshUi(); return setMsg(warn("<b>购物车刚刚有变化，请再确认一下</b>")); }
      if (code === "CART_HOST_ONLY") { scRefreshUi(); return setMsg(warn(`<b>请让 ${phoneLabel(err.data.host)} 下单</b>`)); }
      if (code === "CART_STALE") { m.remove(); scEnded("stale"); return; }
      if (code === "CART_FULL") { m.remove(); scFull(); return; }
      toast(err.message, "error");
      restore();
      if (/下架|售罄|刷新菜单/.test(err.message)) { await loadMenu().catch(() => {}); scRefreshUi(true); }
    }
  }
  return m;
}

// ---------- 平板自助点餐机 ----------
// 下单完成：大字显示取餐号，20 秒后（或点「完成」）清空，给下一位顾客用
let kioskTimer = null;
function showKioskDone(v, { paid = false, problem = "" } = {}) {
  clearInterval(kioskTimer);
  let sec = 20;
  app.innerHTML = `<div class="kiosk-done">
    <div class="kd-label">您的取餐号</div>
    <div class="kd-no num">${esc(v.pickup_label)}</div>
    ${v.dine_option ? `<div class="kd-dine">${v.dine_option === "here" ? "🍽 在这里吃" : "🥡 打包带走"}</div>` : ""}
    ${problem ? `<div class="kd-tip">${esc(problem)}</div>`
      : paid ? `<div class="kd-tip">✅ 已付款，正在制作</div><div class="muted">叫到取餐号请来取餐${S.kiosk.slip ? "；扫小票上的二维码，做好了手机会提醒" : ""}</div>`
      : `<div class="kd-tip">${S.kiosk.slip ? "请拿好小票，到前台付款" : "请记住取餐号，到前台付款"}</div>
    <div class="muted">付款后开始制作${S.kiosk.slip ? "；扫小票上的二维码，做好了手机会提醒" : ""}</div>`}
    <div class="kd-total">${paid ? "已付" : "应付"} <b class="num">${money(v.total_cents)}</b></div>
    <button class="btn primary big" id="kdOk">完成（<span id="kdSec">${sec}</span>）</button></div>`;
  $("#kdOk").onclick = resetKiosk;
  kioskTimer = setInterval(() => { sec--; const el = $("#kdSec"); if (el) el.textContent = sec; if (sec <= 0) resetKiosk(); }, 1000);
}
// 平板刷卡（第三批）：叫刷卡机收钱，每秒查一次结果；成功 → 「已付款」完成页；没成功 → 再刷 / 改现金 / 取消这一单
async function kioskPay(access, v) {
  clearInterval(kioskTimer);
  const base = `/api/public/kiosk/${encodeURIComponent(customerToken)}/pay/${access}`;
  const screen = (html) => { app.innerHTML = `<div class="kiosk-done kiosk-pay">${html}</div>`; };
  const failed = (msg) => {
    screen(`<div class="kd-label">取餐号 ${esc(v.pickup_label)}</div>
      <div class="kd-tip">刷卡没成功</div><div class="muted">${esc(I18N.t(msg || "请再试一次"))}</div>
      <div class="kd-total">应付 <b class="num">${money(v.total_cents)}</b></div>
      <div class="kp-btns"><button class="btn primary big" id="kpRetry">💳 再刷一次</button>
        <button class="btn big" id="kpCash">💶 改现金（到前台付）</button>
        <button class="btn big" id="kpDrop">取消这一单</button></div>`);
    $("#kpRetry").onclick = () => kioskPay(access, v);
    $("#kpCash").onclick = async () => {
      try { await api(`${base}/cash`, { method: "POST", auth: false }); showKioskDone(v); } catch (e) { toast(e.message, "error"); }
    };
    $("#kpDrop").onclick = async () => {
      try { await api(`/api/public/takeaway/${access}/cancel`, { method: "POST", auth: false }); } catch {}
      resetKiosk();
    };
    // 顾客走开了：2 分钟后回到开始页（这一单没付款，30 分钟后自动作废）
    let idle = 120;
    kioskTimer = setInterval(() => { if (--idle <= 0) resetKiosk(); }, 1000);
  };
  let r;
  try { r = await api(base, { method: "POST", auth: false }); } catch (e) { return failed(e.message); }
  screen(`<div class="kd-label">取餐号 ${esc(v.pickup_label)}</div>
    <div class="kd-tip">💳 请在刷卡机上刷卡、插卡或碰一碰</div>
    <div class="kd-total">应付 <b class="num">${money(v.total_cents)}</b></div>
    <button class="btn big" id="kpCancel">取消刷卡</button>`);
  // 取消：叫刷卡机停下，照样等刷卡机给出最后结果（停之前刚好刷成功的照样算已付款）
  $("#kpCancel").onclick = async () => {
    const b = $("#kpCancel");
    b.disabled = true; b.textContent = I18N.t("正在取消…");
    try { const x = await api(`${base}/cancel`, { method: "POST", auth: false }); if (x && x.hint) b.textContent = I18N.t(x.hint); } catch {}
  };
  const t0 = Date.now();
  while (r && r.status === "pending") {
    await new Promise((ok) => setTimeout(ok, 1000));
    try { r = await api(base, { auth: false }); } catch (e) {}
    // 很久都没有结果（收银电脑断网、重启）：不让顾客再刷，到前台核对
    if (Date.now() - t0 > 360000) return showKioskDone(v, { problem: "刷卡结果要到前台核对，请拿取餐号到前台" });
  }
  if (r.status === "paid") return showKioskDone(v, { paid: true });
  if (r.status === "error") return showKioskDone(v, { problem: r.message });
  failed(r.message);
}

// 回到首页：清空购物车、关掉弹层；顾客换过语言的，换回默认语言
let kioskLang = null;
function resetKiosk() {
  clearInterval(kioskTimer);
  S.cart.clear(); S.orderNote = ""; S.q = ""; S.dine = null; S.payPick = null; S.cat = menuCats()[0]?.id;
  try { sessionStorage.removeItem(CART_KEY); } catch {}
  document.querySelectorAll(".sheet-mask, .zoom-mask, .modal-mask").forEach((e) => e.remove());
  if (kioskLang && I18N.lang !== kioskLang) {
    try { localStorage.setItem("pos_lang", JSON.stringify({ lang: kioskLang, mode: "single" })); } catch {}
    return location.reload();
  }
  renderMenu();
  window.scrollTo(0, 0);
}
function startKiosk() {
  document.body.classList.add("kiosk");
  try { kioskLang = JSON.parse(localStorage.getItem("pos_kiosk_lang") || "null"); } catch {}
  if (!kioskLang) { kioskLang = I18N.lang; try { localStorage.setItem("pos_kiosk_lang", JSON.stringify(kioskLang)); } catch {} }
  // 2 分钟没人碰：清空购物车回到首页
  let last = Date.now();
  for (const ev of ["pointerdown", "keydown", "scroll"]) document.addEventListener(ev, () => (last = Date.now()), { passive: true, capture: true });
  setInterval(() => {
    const busy = S.cart.size || document.querySelector(".sheet-mask, .zoom-mask") || S.q;
    if (busy && Date.now() - last > 120000) { last = Date.now(); resetKiosk(); }
  }, 5000);
  // 点一下进入全屏（平板浏览器）
  document.addEventListener("pointerdown", () => { if (!PosFullscreen.isOn()) PosFullscreen.request(); }, { once: true }); // 含 webkit 前缀（老的 iPad / 安卓平板）
  // 店员退出：连点店名 5 下
  let taps = [];
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#storeTitle")) return;
    taps = [...taps.filter((t) => Date.now() - t < 3000), Date.now()];
    if (taps.length < 5) return;
    taps = [];
    if (window.PosApp) return window.PosApp.call("changeServer").catch(() => {});
    PosFullscreen.exit();
    toast(I18N.t("已退出全屏"), "success");
  });
}

// 购物车里的过敏原：含过敏原的菜逐个列出；网上预订（不在店里，没法当面问）要勾选确认

// 网上预订：姓名、电话（记在手机上，下次自动填好）、取餐时间（尽快 或 每 15 分钟一档，往后 4 小时）
function remoteFields() {
  if (!S.contact) {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem("pos_contact") || "{}"); } catch {}
    S.contact = { name: saved.name || "", phone: saved.phone || "", pickup_time: "asap" };
  }
  // 取餐时间：尽快 / 15 分钟后 … 2 小时后（后面写上大约几点）/ 其他（写备注）；最长 2 小时
  const hm = (min) => { const t = new Date(Date.now() + min * 60000); return `${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")}`; };
  const slots = [15, 30, 45, 60, 90, 120];
  const c = S.contact;
  if (!/^(asap|note|\+\d+)$/.test(c.pickup_time)) c.pickup_time = "asap";
  const dv = S.delivery ? dvState() : null;
  const delivering = dv && dv.mode !== "pickup";
  return `${dv ? dvFields(dv) : ""}<div class="remote-fields">
    <div class="rf-title">${delivering || isShop() ? "联系人" : "预订信息"}</div>
    <label><span>${S.remoteNeed?.name === false && !delivering ? "姓名（可选）" : "姓名 *"}</span><input type="text" data-contact="name" maxlength="30" value="${esc(c.name)}" autocomplete="name"></label>
    <label><span>${S.remoteNeed?.phone === false && !delivering ? "电话（可选）" : "电话 *"}</span><input type="tel" data-contact="phone" maxlength="20" value="${esc(c.phone)}" autocomplete="tel" inputmode="tel"></label>
    ${dv?.mode === "ship" ? `<p class="dv-days">📦 ${esc(I18N.t("正常 {0} 天送达").replace("{0}", S.delivery.ship.days))}</p>` : `<label><span>${dv?.mode === "local" ? "送达时间" : "取餐时间"}</span><select data-contact="pickup_time">
      <option value="asap" ${c.pickup_time === "asap" ? "selected" : ""}>尽快</option>
      ${slots.map((m) => `<option value="+${m}" ${c.pickup_time === "+" + m ? "selected" : ""}>${m < 60 ? `${m} 分钟后（约 ${hm(m)}）` : `${m / 60} 小时后（约 ${hm(m)}）`}</option>`).join("")}
      <option value="note" ${c.pickup_time === "note" ? "selected" : ""}>其他（写备注）</option></select></label>`}
    <label data-pickup-note ${c.pickup_time === "note" && dv?.mode !== "ship" ? "" : "hidden"}><span>取餐时间备注 *</span><input type="text" data-contact="pickup_note" maxlength="30" value="${esc(c.pickup_note || "")}" placeholder="如：下班后大概 18:40 到"></label>
    ${S.onlinePay?.mode === "optional" && !delivering ? `<div class="rf-title">付款方式</div>
    <div class="pay-choice">
      <label><input type="radio" name="payMode" data-contact="pay" value="online" ${c.pay !== "store" ? "checked" : ""}> 💳 网上付款（银行卡）</label>
      <label><input type="radio" name="payMode" data-contact="pay" value="store" ${c.pay === "store" ? "checked" : ""}> 🏪 到店付款</label>
    </div>` : ""}
    <p class="muted" style="font-size:12px;margin:4px 0 0">${delivering ? (S.onlinePay ? "提交后请用银行卡网上付款，付款成功餐厅就开始准备。" : "送到时付款（货到付款）。") : S.onlinePay?.mode === "required" ? "提交后请用银行卡网上付款，付款成功餐厅就开始制作。" : S.onlinePay ? "网上付款成功后餐厅马上开始制作；选到店付款的，餐厅确认后开始制作。" : "餐厅确认后开始制作，到店报取餐号付款取餐。"}</p>
  </div>`;
}

// ---------- 配送方式（电商版第 3 批）：到店自取 / 送货上门（按区域收运费）/ 快递邮寄 ----------
// 选过的方式和地址记在手机上，下次自动填好
function dvState() {
  if (!S.dv) {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem("pos_delivery") || "{}"); } catch {}
    S.dv = { mode: "pickup", zone: "", address: "", postcode: "", city: "", ...saved };
  }
  if (S.dv.mode === "local" && !S.delivery?.local) S.dv.mode = "pickup";
  if (S.dv.mode === "ship" && !S.delivery?.ship) S.dv.mode = "pickup";
  if (S.dv.mode === "local" && !S.delivery.local.zones.some((z) => z.name === S.dv.zone)) S.dv.zone = S.delivery.local.zones.length === 1 ? S.delivery.local.zones[0].name : "";
  return S.dv;
}
function saveDv() { try { localStorage.setItem("pos_delivery", JSON.stringify(S.dv)); } catch {} }
// 运费（满额免运费）、还差多少到起送价
function dvQuote(goods) {
  if (!S.delivery) return { fee: 0 };
  const d = dvState();
  const free = (fee, freeAt) => (freeAt > 0 && goods >= freeAt ? 0 : fee);
  if (d.mode === "local") {
    const z = S.delivery.local.zones.find((x) => x.name === d.zone);
    if (!z) return { fee: 0, noZone: true };
    return { fee: free(z.fee_cents, z.free_cents), zone: z, short: goods < z.min_cents ? z.min_cents - goods : 0, freeAt: z.free_cents };
  }
  if (d.mode === "ship") {
    // 产品单独设的邮费（每件）：加在基本运费上，满额免邮不免这部分
    const extra = [...S.cart.values()].reduce((s, l) => s + ((itemById(l.id) || {}).ship_fee_cents || 0) * l.qty, 0);
    return { fee: free(S.delivery.ship.fee_cents, S.delivery.ship.free_cents) + extra, extra, freeAt: S.delivery.ship.free_cents, short: 0 };
  }
  return { fee: 0 };
}
function dvFields(d) {
  const L = S.delivery.local, P = S.delivery.ship;
  const from = L ? Math.min(...L.zones.map((z) => z.fee_cents)) : 0;
  const btn = (mode, icon, name, sub) => `<button type="button" data-dvmode="${mode}" class="${d.mode === mode ? "on" : ""}"><span class="dv-i">${icon}</span><b>${name}</b><small>${sub}</small></button>`;
  return `<div class="remote-fields dv-box">
    <div class="rf-title">配送方式</div>
    <div class="dv-pick">${btn("pickup", "🏪", "到店自取", "免费")}${L ? btn("local", "🛵", "送货上门", from ? `${money(from)} 起` : "免运费") : ""}${P ? btn("ship", "📦", "快递邮寄", P.fee_cents ? money(P.fee_cents) : "免运费") : ""}</div>
    ${d.mode === "local" ? `<label><span>送货区域 *</span><select data-dv="zone"><option value="">请选择</option>${L.zones.map((z) => `<option value="${esc(z.name)}" ${z.name === d.zone ? "selected" : ""}>${esc(z.name)} · ${z.fee_cents ? money(z.fee_cents) : I18N.t("免运费")}</option>`).join("")}</select></label>
      <label><span>送货地址 *</span><input type="text" data-dv="address" maxlength="120" value="${esc(d.address)}" autocomplete="street-address" placeholder="街道、门牌号、楼层"></label>
      <div class="dv-geo">${d.lat != null ? `<span class="dv-ok">📍 已记下您的位置</span><button type="button" class="btn small" data-geoclear>不用位置</button>` : `<button type="button" class="btn small" data-geo>📍 用我现在的位置</button><span class="muted">送货员可以直接导航过来</span>`}</div>`
    : d.mode === "ship" ? `<label><span>邮寄地址 *</span><input type="text" data-dv="address" maxlength="120" value="${esc(d.address)}" autocomplete="street-address" placeholder="街道、门牌号"></label>
      <div class="dv-two"><label><span>邮编 *</span><input type="text" data-dv="postcode" maxlength="10" value="${esc(d.postcode)}" autocomplete="postal-code" inputmode="numeric"></label>
      <label><span>城市 *</span><input type="text" data-dv="city" maxlength="40" value="${esc(d.city)}" autocomplete="address-level2"></label></div>` : ""}
  </div>`;
}

// ---------- 外带凭证 ----------
const VOUCHER_KEY = "takeaway_vouchers";
function savedVouchers() {
  try { return JSON.parse(store.get(VOUCHER_KEY) || "[]"); } catch { return []; }
}
function saveVoucher(token, label) {
  const list = [{ token, label }, ...savedVouchers().filter((v) => v.token !== token)].slice(0, 5);
  store.set(VOUCHER_KEY, JSON.stringify(list));
}
function forgetVoucher(token) {
  store.set(VOUCHER_KEY, JSON.stringify(savedVouchers().filter((v) => v.token !== token)));
}

async function loadVoucher() {
  try {
    S.voucher = await api(`/api/public/takeaway/${S.voucherToken}`, { auth: false });
  } catch (e) {
    if (e.status === 404) forgetVoucher(S.voucherToken);
    throw e;
  }
}

// 网上付款：拿到支付平台的付款页地址，整页跳过去（付完会跳回凭证页）
async function goPay(token) {
  S.payOpening = token; // 凭证页重画（实时推送）时按钮也保持置灰
  const btn = $("#vPay");
  if (btn) { btn.disabled = true; btn.textContent = I18N.t("正在打开付款页…"); }
  try {
    const embed = Boolean(S.onlinePay?.embed) && (S.remote || location.protocol === "https:"); // 店里 WiFi（http）用不了卡号输入框，跳付款页
    // 最多等 70 秒（支付平台慢时服务端每次等 30 秒、再重试一次，最长约 60 秒，页面不能先放弃，付款整改 P1）；按钮一直灰着防连点
    const r = await Promise.race([
      api(`/api/public/takeaway/${token}/pay`, { method: "POST", auth: false, body: { lang: I18N.lang, embed, t: customerToken } }),

    if (r.embed) { await openCardPay(token, r.embed); S.payOpening = null; const b = $("#vPay"); if (b) { b.disabled = false; b.textContent = I18N.t("💳 网上付款") + " " + money(r.embed.amount_cents); } return; }

    toast(!e.status || e.status >= 500 ? I18N.t("付款页暂时打不开，请稍后再点付款") : e.message, "error", 8000);

// 卡号只在支付平台的输入框里（Stripe / SumUp 的安全组件），直接发给支付平台，不经过餐厅的电脑。
const loadedScripts = {};
function loadScript(src) {
  return (loadedScripts[src] ||= new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.onload = resolve;
    s.onerror = () => { delete loadedScripts[src]; reject(new Error(I18N.t("付款组件加载失败，请检查网络后重试"))); };
    document.head.appendChild(s);
  }));
}
const STRIPE_LOCALE = { zh: "zh", fr: "fr", en: "en", es: "es", pt: "pt" };
async function openCardPay(token, e) {
  const mask = sheet(I18N.t("💳 银行卡付款") + " " + money(e.amount_cents), `
    <div id="cardBox" style="min-height:120px"><p class="muted">正在加载安全付款组件…</p></div>
    <p id="cardErr" class="bad" style="min-height:1.2em;margin:8px 0 0"></p>
    <p class="muted" style="font-size:12px;margin:6px 0 0">🔒 卡号直接加密发送给支付平台（${esc(e.provider === "sumup" ? "SumUp" : e.provider === "stripe" ? "Stripe" : "Test")}），餐厅看不到您的卡号。</p>`,
    e.provider === "sumup" ? "" : `<button class="btn primary big" id="cardPay" style="width:100%" disabled>支付 ${money(e.amount_cents)}</button>`);
  const err = (m) => { const el = $("#cardErr", mask); if (el) el.textContent = m || ""; };
  // 卡号付完：查到已付才说收到；还没查到就显示「正在确认付款结果…」接着问（P5）
  const done = async () => {
    mask.remove(); S.payWait = token;
    await showVoucher(token, { sync: true });
    if (S.voucher?.status === "unpaid") pollPaid(token);
    else { S.payWait = null; if (S.voucher?.status === "paid") toast(I18N.t("付款成功，餐厅开始为您准备"), "success"); }
  };
  const box = $("#cardBox", mask);
  try {
    if (e.provider === "stripe") {
      await loadScript("https://js.stripe.com/v3/");
      const stripe = window.Stripe(e.publishable_key, { locale: STRIPE_LOCALE[I18N.lang] || "auto" });
      const elements = stripe.elements({ clientSecret: e.client_secret, appearance: { theme: "stripe", variables: { colorPrimary: (window.POS_THEME && window.POS_THEME.color) || "#c2410c", borderRadius: "10px" } } });
      box.innerHTML = "";

        const b = ev.currentTarget;

      };
    } else if (e.provider === "sumup") {
      await loadScript("https://gateway.sumup.com/gateway/ecom/card/v2/sdk.js");
      box.innerHTML = `<div id="sumupCard"></div>`;
      const loc = { zh: "en-GB", fr: "fr-FR", en: "en-GB", es: "es-ES", pt: "pt-PT" }[I18N.lang] || "fr-FR";
      window.SumUpCard.mount({
        id: "sumupCard", checkoutId: e.client_secret, locale: loc, showSubmitButton: true,
        onResponse: (type, body) => {
          if (type === "success") done();
          else if (type === "error" || type === "fail") err(body?.message || I18N.t("付款没有成功，请检查卡号或换一张卡"));
        },
      });
    } else {
      // 测试模式（ONLINE_PAY_FAKE=1）：模拟卡号输入框，4242 开头算成功
      const inp = 'style="width:100%;box-sizing:border-box;min-width:0"';
      box.innerHTML = `<label class="field"><span>卡号</span><input id="fakeCard" ${inp} inputmode="numeric" autocomplete="cc-number" placeholder="4242 4242 4242 4242"></label>
        <div style="display:flex;gap:8px"><label class="field" style="flex:1;min-width:0"><span>有效期</span><input id="fakeExp" ${inp} placeholder="12/30"></label><label class="field" style="flex:1;min-width:0"><span>CVC</span><input id="fakeCvc" ${inp} placeholder="123"></label></div>`;
      $("#cardPay", mask).disabled = false;

        const ok = /^4242/.test($("#fakeCard", mask).value.replace(/\s/g, ""));
        if (!ok) return err(I18N.t("付款没有成功，请检查卡号或换一张卡"));
        await fetch(`/api/public/fakepay/${e.client_secret}/done?ok=1&json=1`);
        await done();
      };
    }
  } catch (ex) { err(ex.message); }
}

async function showVoucher(token, { sync = false } = {}) {
  S.voucherToken = token;
  history.replaceState(null, "", location.pathname + location.search + "#v=" + token);
  try {
    if (sync) S.voucher = await api(`/api/public/takeaway/${token}?sync=1`, { auth: false });
    else await loadVoucher();
  } catch (e) {
    toast(e.message, "error");
    return backToMenu();
  }
  renderVoucher();
  window.scrollTo(0, 0);
}

function pollPaid(token, n = 0) {
  setTimeout(async () => {
    if (S.voucherToken !== token || S.payWait !== token) return;
    try { S.voucher = await api(`/api/public/takeaway/${token}?sync=1`, { auth: false }); } catch {}
    if (S.voucher?.status !== "unpaid" || n >= 40) {
      S.payWait = null;
      if (S.voucher?.status === "paid") toast(I18N.t("付款成功，餐厅开始为您准备"), "success");
      else if (S.voucher?.status === "unpaid") toast(I18N.t("付款没有成功，请重新付款"), "error", 8000); // 一直查不到已付：付款按钮重新出现（P5）
    }
    if (S.voucherToken === token) renderVoucher();
    if (S.payWait === token) pollPaid(token, n + 1);
  }, 4000);
}

function backToMenu() {
  S.voucherToken = null;
  S.voucher = null;
  history.replaceState(null, "", location.pathname + location.search);
  renderMenu();
}

// 「做好了」提醒：手机响铃 + 振动。手机浏览器要先点一下页面才允许出声，所以凭证页有「开启提醒」按钮
let audioCtx = null;
function unlockAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();

  } catch { return false; }
}

function beep(times = 3) {
  if (!audioCtx) return;
  for (let n = 0; n < times; n++) {
    [988, 1319, 1568].forEach((f, i) => {
      const t0 = audioCtx.currentTime + n * 0.9 + i * 0.16;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.35, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.35);
      o.start(t0); o.stop(t0 + 0.37);
    });
  }
}
let wasReady = null;

// 送货上门 / 快递邮寄的订单状态：待付款 → 准备中 → 已送出 / 已寄出（不说「取餐」「取餐号」）
function dvStatus(v, key) {
  const ship = v.delivery.mode === "ship";
  if (key === "cancelled" || key === "refunded") return VOUCHER_STATUS[key];
  if (key === "unpaid") return ["待付款", "#e08a00", () => v.pay_mode === "online" ? "请完成网上付款，付款成功后我们马上开始准备。"

  if (key === "picked_up") return ship ? ["已寄出", "#1d4ed8", () => (v.delivery.tracking ? "已寄出，可以用下面的快递单号查询。" : "已寄出。")]
    : ["已送出", "#1d4ed8", () => "已经在路上了，请保持电话畅通。"];
  // paid / ready：都还在店里准备
  return ["已付款 · 准备中", "#1e8e3e", () => (ship ? `正在打包，正常 ${esc(v.delivery.days)} 天送达，寄出后这里显示快递单号。` : "我们正在准备，准备好就给您送过去。")];
}

  const others = savedVouchers().filter((x) => x.token !== S.voucherToken);
  app.innerHTML = `
    <div class="head"><button id="back">‹ 点餐</button><h1>${v.delivery ? "我的订单" : "外带取餐凭证"}</h1></div>

        <div class="v-label">${v.delivery ? "订单号" : "取餐号"}</div>
        <div class="v-no num">${v.pickup_label}</div>
        <div class="v-status">${label}</div>
        <p class="v-tip">${S.payWait && S.payWait === S.voucherToken && v.status === "unpaid" ? "正在确认付款结果…" : tip(v)}</p>
      </div>
      ${v.delivery ? `<div class="v-dv">${v.delivery.mode === "local" ? `<b>🛵 送货上门 · ${esc(v.delivery.zone)}</b><div>${esc(v.delivery.address)}</div><div class="muted">送达时间：${v.pickup_time ? esc(String(v.pickup_time).slice(11, 16)) : "尽快"}</div>`
        : `<b>📦 快递邮寄</b><div>${esc(v.delivery.address)}, ${esc(v.delivery.postcode)} ${esc(v.delivery.city)}</div>${v.delivery.tracking ? `<div class="v-track">快递单号：${v.delivery.track_url ? `<a href="${esc(v.delivery.track_url)}" target="_blank" rel="noopener" translate="no"><b>${esc(v.delivery.tracking)}</b> ›</a><div class="muted" style="font-size:12px">点单号打开快递公司的查询页</div>` : `<b translate="no">${esc(v.delivery.tracking)}</b>`}</div>` : ""}`}</div>` : ""}
      ${["unpaid", "paid"].includes(v.status) && !v.ready && !v.delivery ? `<button class="btn v-pay" id="vAlert" style="margin:10px 0 0;width:100%">${audioCtx && audioCtx.state === "running" ? "🔔 已开启：做好了会响铃、振动" : "🔔 做好了响铃 + 振动提醒我（点一下开启）"}</button>` : ""}
      <div class="v-items">
        ${vNote(v) ? `<div class="row"><span class="n item-opts">整单备注：${esc(vNote(v))}</span></div>` : ""}
        ${v.items.map((i) => `<div class="row"><span class="n">${esc(i.name)}${i.options_text ? `<div class="item-opts">${esc(i.options_text)}</div>` : ""}${i.note ? `<div class="item-opts note">※ ${esc(i.note)}</div>` : ""}</span><span class="muted">x${i.qty}</span><span class="num">${money(i.price_cents * i.qty)}</span></div>`).join("")}
        ${v.discount_cents ? `<div class="row"><span class="n">优惠</span><span class="num">-${money(v.discount_cents)}</span></div>` : ""}
        ${(v.charges || []).map((c) => `<div class="row"><span class="n">${esc(c.note)}</span><span class="num">+${money(c.amount_cents)}</span></div>`).join("")}
        <div class="row total"><span class="n">${v.status === "unpaid" ? "应付" : "合计"}</span><b class="num">${money(v.total_cents)}</b></div>
        <div class="muted" style="font-size:12px;margin-top:6px">下单时间 ${esc(v.created_at)}</div>
        ${v.status === "unpaid" && v.online_pay?.available && v.pay_mode === "online" && S.payWait !== S.voucherToken ? (S.payOpening === S.voucherToken ? `<button class="btn primary big v-pay" id="vPay" disabled>正在打开付款页…</button>` : `<button class="btn primary big v-pay" id="vPay">💳 网上付款 ${money(v.total_cents)}</button>`) : ""}
      </div>
      <div class="v-actions">
        ${v.status === "unpaid" && !v.accepted ? `<button class="btn danger" id="vCancel">取消订单</button>` : ""}
        <button class="btn primary" id="vMore">再点一单</button>
      </div>
      ${others.length ? `<div class="v-others">其他外带单：${others.map((o) => `<button class="btn small" data-v="${esc(o.token)}">${esc(o.label)}</button>`).join(" ")}</div>` : ""}
    </div>`;
  $("#back").onclick = backToMenu;
  $("#vMore").onclick = backToMenu;
  $("#vPay")?.addEventListener("click", () => goPay(S.voucherToken));
  $("#vAlert")?.addEventListener("click", async () => {
    if (unlockAudio()) beep(1);
    try { navigator.vibrate && navigator.vibrate(200); } catch {}
    const sys = await enableSystemNotice();
    toast(I18N.t(sys ? "已开启提醒：做好了会响铃、振动并弹出通知" : "已开启提醒，做好了手机会响铃、振动"), "success");
    renderVoucher();
  });
  $("#vCancel")?.addEventListener("click", async () => {
    if (!confirm(I18N.t("确定取消这张外带单吗？"))) return;
    try {
      S.voucher = await api(`/api/public/takeaway/${S.voucherToken}/cancel`, { method: "POST", auth: false });
      renderVoucher();
    } catch (e) { toast(e.message, "error"); }
  });
  app.querySelectorAll("[data-v]").forEach((b) => (b.onclick = () => showVoucher(b.dataset.v)));
}

// 「已点」弹层开着时别的手机 / 服务员又下了单、退了菜、结了账：实时更新（v1.25.2，以前要关掉再打开才看得到）
let orderedSheet = null, orderedSig = "";
const orderedBody = (o) => (o.note ? `<div class="row"><span class="n item-opts">整单备注：${esc(o.note)}</span></div>` : "") +
  o.items.map((i) => `<div class="row"><span class="n">${esc(i.name)}${i.options_text ? `<div class="item-opts">${esc(i.options_text)}</div>` : ""}${i.note ? `<div class="item-opts note">※ ${esc(i.note)}</div>` : ""}</span><span class="muted">x${i.qty}</span><span class="num">${money(i.price_cents * i.qty)}</span></div>`).join("");
const orderedFoot = (o) => `<div style="flex:1">合计 <b class="num" style="font-size:18px">${money(o.subtotal_cents)}</b></div><span class="muted" style="font-size:12px">${customerToken ? "如需退菜/结账请联系服务员" : "退菜请在收银台操作"}</span>`;
function openOrdered() {
  const o = S.ordered;
  if (!o) return;
  orderedSheet = sheet(`${esc(S.table.table_no)} 桌 · 已点菜品`, orderedBody(o), orderedFoot(o));
  orderedSig = JSON.stringify(o);
}
function refreshOrdered() {
  const m = orderedSheet;
  if (!m || !m.isConnected) { orderedSheet = null; return; }
  const o = S.ordered;
  // 结账 / 作废了（这桌没有单了）：关掉弹层
  if (!o || !o.items.length) { m.remove(); orderedSheet = null; return; }
  const sig = JSON.stringify(o);
  if (orderedSig === sig) return; // 没变：不重画（免得滚动位置跳回顶部）
  orderedSig = sig;
  const sb = $(".sb", m), top = sb.scrollTop;
  sb.innerHTML = orderedBody(o);
  $(".sf", m).innerHTML = orderedFoot(o);
  sb.scrollTop = top;
}

boot();
</script>
</body>
</html>
